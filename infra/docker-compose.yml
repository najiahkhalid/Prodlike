# Local demo stack (ADR-001: laptop demo, no cloud).
#   cp .env.example .env
#   docker compose -f infra/docker-compose.yml --env-file .env up --build
# Then open https://localhost (Caddy issues a local certificate; accept it once).
name: prodlike

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prodlike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prodlike}
      POSTGRES_DB: ${POSTGRES_DB:-prodlike}
    ports:
      - '5432:5432' # exposed so `pnpm dev` on the host can use the same database
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-prodlike} -d ${POSTGRES_DB:-prodlike}']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prodlike}:${POSTGRES_PASSWORD:-prodlike}@postgres:5432/${POSTGRES_DB:-prodlike}?schema=public
      API_PORT: 4000
      WEB_ORIGIN: https://localhost
      APP_URL: https://localhost
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      COOKIE_SECURE: 'true' # served over HTTPS by Caddy
      SCENARIOS_DIR: /repo/scenarios
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@prodlike.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    # The API starts one sandbox container per attempt through the host's Docker (ADR-005).
    # Build the images first on the host: pnpm scenarios:build
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
