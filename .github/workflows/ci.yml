name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prodlike
          POSTGRES_PASSWORD: prodlike
          POSTGRES_DB: prodlike
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prodlike" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://prodlike:prodlike@localhost:5432/prodlike?schema=public
      # API integration tests (they truncate this database)
      DATABASE_URL_TEST: postgresql://prodlike:prodlike@localhost:5432/prodlike?schema=public
      # Browser tests use their own database
      E2E_DATABASE_URL: postgresql://prodlike:prodlike@localhost:5432/prodlike_e2e?schema=public
      # Run the Docker-backed sandbox tests (API integration + Playwright workspace tests)
      SANDBOX_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build sandbox images (needed by the sandbox tests)
        run: node infra/scripts/build-scenarios.mjs
      - name: Dependency audit (production dependencies; fails on high or critical, see docs/security.md)
        run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm db:generate
      - name: Apply migrations to a real Postgres
        run: pnpm --filter @prodlike/api prisma:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm scenarios:validate
      - name: Prepare the end-to-end database (migrate + seed admin)
        run: |
          PGPASSWORD=prodlike psql -h localhost -U prodlike -c 'CREATE DATABASE prodlike_e2e'
          DATABASE_URL=$E2E_DATABASE_URL pnpm --filter @prodlike/api prisma:deploy
          DATABASE_URL=$E2E_DATABASE_URL ADMIN_EMAIL=admin@e2e.test ADMIN_PASSWORD=admin-password-123 \
            pnpm --filter @prodlike/api db:seed
      # System libraries and the browser download are separate steps with retries: either one can hit a
      # flaky mirror on shared runners, and the log then says which part failed.
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q && pnpm --filter @prodlike/e2e exec playwright install-deps chromium && exit 0
            echo "attempt $i failed, retrying in 15 s"; sleep 15
          done
          exit 1
      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            pnpm --filter @prodlike/e2e exec playwright install chromium && exit 0
            echo "attempt $i failed, retrying in 15 s"; sleep 15
          done
          exit 1
      - name: End-to-end tests (Playwright)
        run: pnpm --filter @prodlike/e2e e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  scenario-images:
    name: Scenario sandbox images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox base + scenario images
        run: node infra/scripts/build-scenarios.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prodlike/shared build
      - name: Every scenario — tests pass, hidden tests catch the bug, reference fixes pass, sandbox is isolated
        run: node infra/scripts/check-scenarios.mjs

  stack:
    name: Docker Compose stack boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f infra/docker-compose.yml --env-file .env up -d --build
      - name: Wait for HTTPS + API health
        run: |
          for i in $(seq 1 60); do
            if curl -skf https://localhost/api/health | tee /tmp/health.json | grep -q '"database":"up"'; then
              echo; echo "API healthy"; break
            fi
            sleep 3
          done
          grep -q '"database":"up"' /tmp/health.json
          curl -skf https://localhost/ | grep -q "Platform status"
          echo "Web page served over HTTPS"
          curl -skf https://localhost/api/scenarios | grep -q '"slug":"discount-bug"'
          echo "Scenario synced into the database"
      - name: Sign up through the stack (HTTPS + secure cookies)
        run: |
          code=$(curl -sk -o /tmp/reg.json -w '%{http_code}' -c /tmp/jar -H 'content-type: application/json' \
            -d '{"name":"CI Bot","email":"ci@stack.test","password":"ci-password-123"}' https://localhost/api/auth/register)
          cat /tmp/reg.json; echo
          test "$code" = "201"
          grep -q 'pl_at' /tmp/jar
          curl -skf -b /tmp/jar https://localhost/api/auth/me | grep -q '"email":"ci@stack.test"'
          echo "Registered and authenticated through Caddy"
      - name: Security headers on web and API responses (docs/security.md)
        run: |
          for url in https://localhost/ https://localhost/api/health; do
            curl -skI "$url" | tr -d '\r' > /tmp/h.txt
            cat /tmp/h.txt
            for h in 'strict-transport-security: max-age=' 'x-content-type-options: nosniff' \
                     'x-frame-options: DENY' "content-security-policy: default-src 'self'" 'referrer-policy:'; do
              grep -qi "^$h" /tmp/h.txt || { echo "missing on $url: $h"; exit 1; }
            done
            if grep -qiE '^(server|x-powered-by):' /tmp/h.txt; then echo "server banner on $url"; exit 1; fi
          done
          echo "Security headers present"
      - name: Live channel (Socket.IO) reachable through Caddy
        run: |
          curl -skf "https://localhost/api/socket.io/?EIO=4&transport=polling" | grep -q '"sid"'
          echo "Socket.IO handshake OK through Caddy"
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 100
